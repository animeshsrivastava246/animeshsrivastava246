<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid -->
  <g opacity="0.025">
    <line x1="0" y1="64" x2="800" y2="64" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="128" x2="800" y2="128" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="192" x2="800" y2="192" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="256" x2="800" y2="256" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#a855f7" stroke-width="0.5"/>
  </g>

  <!-- ===== PRINCIPLE 1: Clean Architecture ===== -->
  <g>
    <!-- Icon: layers -->
    <rect x="52" y="38" width="16" height="3" rx="1" fill="#a855f7" opacity="0.9"/>
    <rect x="48" y="44" width="24" height="3" rx="1" fill="#a855f7" opacity="0.7"/>
    <rect x="44" y="50" width="32" height="3" rx="1" fill="#a855f7" opacity="0.5"/>
    <!-- Title -->
    <text x="90" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#c084fc">CLEAN ARCHITECTURE</text>
    <!-- Bar track -->
    <rect x="44" y="62" width="712" height="6" rx="3" fill="#1e1b4b" opacity="0.6"/>
    <!-- Bar fill -->
    <rect x="44" y="62" width="0" rx="3" height="6" fill="url(#barPurple)">
      <animate attributeName="width" from="0" to="670" dur="1.5s" fill="freeze" begin="0.2s"/>
    </rect>
    <!-- Bar glow dot -->
    <circle cx="714" cy="65" r="4" fill="#a855f7" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.5s" fill="freeze" begin="0.2s"/>
    </circle>
    <!-- Description -->
    <text x="44" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Separation of concerns, dependency inversion, SOLID principles</text>
  </g>

  <!-- ===== PRINCIPLE 2: Performance First ===== -->
  <g>
    <!-- Icon: lightning bolt -->
    <polygon points="60,96 54,110 58,110 52,124 66,108 62,108 68,96" fill="#06b6d4" opacity="0.8"/>
    <!-- Title -->
    <text x="90" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#22d3ee">PERFORMANCE FIRST</text>
    <!-- Bar track -->
    <rect x="44" y="122" width="712" height="6" rx="3" fill="#1e1b4b" opacity="0.6"/>
    <!-- Bar fill -->
    <rect x="44" y="122" width="0" rx="3" height="6" fill="url(#barCyan)">
      <animate attributeName="width" from="0" to="640" dur="1.5s" fill="freeze" begin="0.5s"/>
    </rect>
    <circle cx="684" cy="125" r="4" fill="#06b6d4" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.5s" fill="freeze" begin="0.5s"/>
    </circle>
    <!-- Description -->
    <text x="44" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Measure everything, profile bottlenecks, optimize what matters</text>
  </g>

  <!-- ===== PRINCIPLE 3: Scalability ===== -->
  <g>
    <!-- Icon: expanding arrows -->
    <line x1="52" y1="172" x2="68" y2="156" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="156" x2="68" y2="156" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="156" x2="68" y2="162" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="172" x2="52" y2="156" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Title -->
    <text x="90" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f472b6">SCALABILITY</text>
    <!-- Bar track -->
    <rect x="44" y="180" width="712" height="6" rx="3" fill="#1e1b4b" opacity="0.6"/>
    <!-- Bar fill -->
    <rect x="44" y="180" width="0" rx="3" height="6" fill="url(#barPink)">
      <animate attributeName="width" from="0" to="600" dur="1.5s" fill="freeze" begin="0.8s"/>
    </rect>
    <circle cx="644" cy="183" r="4" fill="#f472b6" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.5s" fill="freeze" begin="0.8s"/>
    </circle>
    <!-- Description -->
    <text x="44" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Design for 10x, build for today, horizontal scaling by default</text>
  </g>

  <!-- ===== PRINCIPLE 4: Simplicity ===== -->
  <g>
    <!-- Icon: minimal square -->
    <rect x="50" y="215" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
    <circle cx="60" cy="225" r="4" fill="#818cf8" opacity="0.5"/>
    <!-- Title -->
    <text x="90" y="230" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">SIMPLICITY</text>
    <!-- Bar track -->
    <rect x="44" y="240" width="712" height="6" rx="3" fill="#1e1b4b" opacity="0.6"/>
    <!-- Bar fill -->
    <rect x="44" y="240" width="0" rx="3" height="6" fill="url(#barIndigo)">
      <animate attributeName="width" from="0" to="690" dur="1.5s" fill="freeze" begin="1.1s"/>
    </rect>
    <circle cx="734" cy="243" r="4" fill="#818cf8" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.5s" fill="freeze" begin="1.1s"/>
    </circle>
    <!-- Description -->
    <text x="44" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Simple scales better than complex — readable, maintainable, deletable</text>
  </g>

  <!-- ===== PRINCIPLE 5: Testability ===== -->
  <g>
    <!-- Icon: checkmark -->
    <circle cx="60" cy="284" r="11" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
    <path d="M54 284 L58 289 L67 278" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Title -->
    <text x="90" y="290" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#34d399">TESTABILITY</text>
    <!-- Bar track -->
    <rect x="44" y="298" width="712" height="6" rx="3" fill="#1e1b4b" opacity="0.6"/>
    <!-- Bar fill -->
    <rect x="44" y="298" width="0" rx="3" height="6" fill="url(#barGreen)">
      <animate attributeName="width" from="0" to="620" dur="1.5s" fill="freeze" begin="1.4s"/>
    </rect>
    <circle cx="664" cy="301" r="4" fill="#34d399" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.5s" fill="freeze" begin="1.4s"/>
    </circle>
    <!-- Description -->
    <text x="44" y="318" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">If it's not tested, it's not done — TDD, integration, e2e</text>
  </g>

  <!-- Ambient particles -->
  <circle cx="750" cy="40" r="1.2" fill="#a855f7" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="280" r="1" fill="#06b6d4" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
