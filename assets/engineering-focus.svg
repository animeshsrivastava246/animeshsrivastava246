<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="105" x2="800" y2="105" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="800" y2="210" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="800" y2="315" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#a855f7" stroke-width="0.5"/>
  </g>

  <!-- CENTER HUB -->
  <!-- Outer ring glow -->
  <circle cx="400" cy="210" r="62" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.15" filter="url(#softGlow)"/>
  <!-- Outer ring -->
  <circle cx="400" cy="210" r="52" fill="#1a1145" stroke="#a855f7" stroke-width="2" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="400" cy="210" r="42" fill="#0d0a1f" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
  <!-- Center icon - neural network node -->
  <circle cx="400" cy="200" r="4" fill="#a855f7"/>
  <circle cx="390" cy="215" r="3" fill="#06b6d4"/>
  <circle cx="410" cy="215" r="3" fill="#f472b6"/>
  <circle cx="400" cy="228" r="3" fill="#818cf8"/>
  <line x1="400" y1="200" x2="390" y2="215" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
  <line x1="400" y1="200" x2="410" y2="215" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
  <line x1="390" y1="215" x2="400" y2="228" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
  <line x1="410" y1="215" x2="400" y2="228" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
  <line x1="390" y1="215" x2="410" y2="215" stroke="#c084fc" stroke-width="1" opacity="0.4"/>

  <!-- ===== CONNECTING LINES from center to cards ===== -->
  <!-- Top-left: System Design -->
  <path d="M360 180 L215 95" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="215" cy="95" r="4" fill="#a855f7" filter="url(#glow)"/>

  <!-- Top-right: Backend -->
  <path d="M440 180 L585 95" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="585" cy="95" r="4" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Bottom-left: Performance -->
  <path d="M360 240 L215 325" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="215" cy="325" r="4" fill="#f472b6" filter="url(#glow)"/>

  <!-- Bottom-right: Code Quality -->
  <path d="M440 240 L585 325" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="585" cy="325" r="4" fill="#818cf8" filter="url(#glow)"/>

  <!-- ===== CARD 1: System Design (top-left) ===== -->
  <g>
    <rect x="40" y="30" width="280" height="130" rx="12" fill="#1a1145" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <rect x="40" y="30" width="280" height="130" rx="12" fill="#a855f7" opacity="0.04"/>
    <!-- Card accent line -->
    <rect x="40" y="30" width="280" height="3" rx="2" fill="url(#purple)" opacity="0.6"/>
    <!-- Icon: layers/architecture -->
    <rect x="62" y="52" width="18" height="4" rx="1" fill="#a855f7" opacity="0.9"/>
    <rect x="58" y="60" width="26" height="4" rx="1" fill="#a855f7" opacity="0.7"/>
    <rect x="54" y="68" width="34" height="4" rx="1" fill="#a855f7" opacity="0.5"/>
    <!-- Title -->
    <text x="100" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#c084fc">System Design</text>
    <!-- Items -->
    <text x="62" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Distributed Systems</text>
    <text x="62" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">High Availability</text>
    <text x="185" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Load Balancing</text>
    <text x="185" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">CAP Theorem</text>
    <!-- Decorative dots -->
    <circle cx="55" cy="96" r="2" fill="#a855f7" opacity="0.6"/>
    <circle cx="55" cy="114" r="2" fill="#a855f7" opacity="0.6"/>
    <circle cx="178" cy="96" r="2" fill="#a855f7" opacity="0.6"/>
    <circle cx="178" cy="114" r="2" fill="#a855f7" opacity="0.6"/>
  </g>

  <!-- ===== CARD 2: Backend Mastery (top-right) ===== -->
  <g>
    <rect x="480" y="30" width="280" height="130" rx="12" fill="#1a1145" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
    <rect x="480" y="30" width="280" height="130" rx="12" fill="#06b6d4" opacity="0.04"/>
    <rect x="480" y="30" width="280" height="3" rx="2" fill="url(#cyan)" opacity="0.6"/>
    <!-- Icon: terminal/code -->
    <text x="502" y="72" font-family="monospace" font-size="18" fill="#06b6d4" opacity="0.9">~$</text>
    <rect x="530" y="60" width="20" height="3" rx="1" fill="#06b6d4" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- Title -->
    <text x="540" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#22d3ee">Backend Mastery</text>
    <!-- Items -->
    <text x="502" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Microservices</text>
    <text x="502" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Event-Driven Arch</text>
    <text x="625" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">RESTful APIs</text>
    <text x="625" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">gRPC</text>
    <circle cx="495" cy="96" r="2" fill="#06b6d4" opacity="0.6"/>
    <circle cx="495" cy="114" r="2" fill="#06b6d4" opacity="0.6"/>
    <circle cx="618" cy="96" r="2" fill="#06b6d4" opacity="0.6"/>
    <circle cx="618" cy="114" r="2" fill="#06b6d4" opacity="0.6"/>
  </g>

  <!-- ===== CARD 3: Performance (bottom-left) ===== -->
  <g>
    <rect x="40" y="260" width="280" height="130" rx="12" fill="#1a1145" stroke="#f472b6" stroke-width="1" opacity="0.8"/>
    <rect x="40" y="260" width="280" height="130" rx="12" fill="#f472b6" opacity="0.04"/>
    <rect x="40" y="260" width="280" height="3" rx="2" fill="url(#pink)" opacity="0.6"/>
    <!-- Icon: speedometer -->
    <path d="M62 300 A18 18 0 0 1 98 300" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.8"/>
    <line x1="80" y1="300" x2="88" y2="288" stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animate attributeName="x2" values="88;72;88" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="288;286;288" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="80" cy="300" r="3" fill="#f472b6"/>
    <!-- Title -->
    <text x="110" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f472b6">Performance</text>
    <!-- Items -->
    <text x="62" y="330" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Caching Strategies</text>
    <text x="62" y="348" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">DB Optimization</text>
    <text x="195" y="330" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Latency Reduction</text>
    <text x="195" y="348" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Profiling</text>
    <circle cx="55" cy="326" r="2" fill="#f472b6" opacity="0.6"/>
    <circle cx="55" cy="344" r="2" fill="#f472b6" opacity="0.6"/>
    <circle cx="188" cy="326" r="2" fill="#f472b6" opacity="0.6"/>
    <circle cx="188" cy="344" r="2" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- ===== CARD 4: Code Quality (bottom-right) ===== -->
  <g>
    <rect x="480" y="260" width="280" height="130" rx="12" fill="#1a1145" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <rect x="480" y="260" width="280" height="130" rx="12" fill="#818cf8" opacity="0.04"/>
    <rect x="480" y="260" width="280" height="3" rx="2" fill="url(#indigo)" opacity="0.6"/>
    <!-- Icon: checkmark/shield -->
    <rect x="497" y="278" width="26" height="30" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
    <path d="M504 295 L508 300 L518 288" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Title -->
    <text x="535" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#a5b4fc">Code Quality</text>
    <!-- Items -->
    <text x="502" y="330" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Clean Architecture</text>
    <text x="502" y="348" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Design Patterns</text>
    <text x="630" y="330" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">TDD</text>
    <text x="630" y="348" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Code Reviews</text>
    <circle cx="495" cy="326" r="2" fill="#818cf8" opacity="0.6"/>
    <circle cx="495" cy="344" r="2" fill="#818cf8" opacity="0.6"/>
    <circle cx="623" cy="326" r="2" fill="#818cf8" opacity="0.6"/>
    <circle cx="623" cy="344" r="2" fill="#818cf8" opacity="0.6"/>
  </g>

  <!-- Ambient particles -->
  <circle cx="30" cy="210" r="1.5" fill="#a855f7" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="210" r="1.5" fill="#06b6d4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="15" r="1" fill="#f472b6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="405" r="1" fill="#818cf8" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
